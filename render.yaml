# Render blueprint for the Praxis API.
#
# Praxis has two parts to host: this Python API (Render, Fly, Railway, any VPS —
# anything that runs a Docker container) and the React SPA, which is deployed to
# Freebuff Sites and proxies /api/* here, so the browser stays same-origin.
#
# Deploy: Render → New → Blueprint → point at this repository. Two values are
# deliberately not in this file and must be set in the dashboard:
#   MASTER_KEY   `openssl rand -base64 32` (32 bytes, base64) → Encryption section
#   JWT_SECRET   `openssl rand -base64 48` → Environment section
# The Postgres password is generated by Render into DATABASE_SECRET and needs no
# manual handling.
#
# Free tier notes: the instance spins down after 15 minutes idle (first request
# wakes it in ~30s) and the free Postgres expires after 30 days — export the DB
# before then, or move to a paid instance.
services:
  - type: web
    name: praxis-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: SEED_ON_STARTUP
        value: "false"
      # Single origin: the Sites worker proxies /api here, so the browser never
      # makes a cross-origin call and CORS can stay empty. CORS_ORIGINS as an
      # empty array is not expressible in this blueprint, so if you later host
      # the SPA on a different origin, set this key in the dashboard instead.
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /data/storage
      - key: DATABASE_URL
        fromDatabase:
          name: praxis-db
          property: connectionString
      # MASTER_KEY must be 32 random bytes in base64 — Render's generateValue
      # produces hex, which fails the key-length check at boot. Run
      # `openssl rand -base64 32` and paste it in the dashboard.
      - key: MASTER_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: auto
      - key: LLM_API_KEY
        sync: false
    disk:
      name: praxis-storage
      mountPath: /data/storage
      sizeGB: 1

databases:
  - name: praxis-db
    plan: free
    databaseName: praxis
