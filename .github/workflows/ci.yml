name: CI

# main is built, tested and deployed by deploy.yml (which calls this workflow),
# so it is not listed under push: here, to avoid running the tests twice.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
          POSTGRES_DB: praxis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U praxis -d praxis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://praxis:praxis@localhost:5432/praxis_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://praxis:praxis@localhost:5432/praxis_test' || '' }}
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
