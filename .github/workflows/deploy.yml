name: Deploy

# Merging master into main is the only way to release. Tests run first; nothing
# is built or deployed unless they pass. See docs/DEPLOYMENT.md for the secrets
# and variables this workflow needs.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_KEEP: 3

jobs:
  ci:
    name: Tests
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push backend image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      package: ${{ steps.name.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "package=${repo#*/}-backend" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}-backend:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          # A host needs one fixed reference to create the service from; deploys
          # then pass the exact sha tag.
          echo "latest=ghcr.io/${repo}-backend:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # One manifest per push: provenance/SBOM attestations add extra
          # untagged package versions, which would break "keep the latest 3".
          provenance: false
          sbom: false
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy backend (${{ vars.BACKEND_HOST || 'railway' }})
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Render
        if: vars.BACKEND_HOST == 'render'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: scripts/deploy-render.sh
      - name: Point Railway at the new image
        if: vars.BACKEND_HOST != 'render'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: scripts/deploy-railway.sh
      - name: Wait for this revision to be live and healthy
        run: scripts/wait-for-revision.sh "${{ vars.BACKEND_URL }}" "${{ github.sha }}"

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Proxy /api to the backend
        working-directory: .
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: scripts/configure-vercel.sh
      - run: npx --yes vercel@65.8.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@65.8.0 build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        run: echo "url=$(npx --yes vercel@65.8.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
      - name: Smoke test through the frontend proxy
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 "${{ steps.deploy.outputs.url }}/api/health" | jq -e --arg sha "${{ github.sha }}" '.status == "ok" and .revision == $sha'; then
              exit 0
            fi
            sleep 10
          done
          echo "The frontend could not reach the backend through /api" >&2
          exit 1

  prune-images:
    name: Prune old backend images (keep latest 3)
    needs: [image, deploy-frontend]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ needs.image.outputs.package }}
          package-type: container
          min-versions-to-keep: ${{ env.IMAGE_KEEP }}
          token: ${{ secrets.GITHUB_TOKEN }}
